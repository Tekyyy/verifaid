packages:
  - contracts
  - services/*
  - indexer
  - app
  - demo

# pnpm blocks dependency install scripts unless they are listed here.
allowBuilds:
  # native speed-up pulled in transitively by hardhat (via eas-contracts); pure-JS fallback is fine
  keccak: false
  # Prisma needs its postinstall to fetch the query engine and generate the client
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # esbuild (vitest, tsx) ships a platform binary
  esbuild: true
  # Ponder's file watcher and transpiler ship native binaries
  '@parcel/watcher': true
  '@swc/core': true
  # optional websocket speed-ups with pure-JS fallbacks
  bufferutil: false
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
  - hono@4.13.8

# Security fixes for transitive dependencies whose parents pin an older release.
overrides:
  # The EAS package is here for its Solidity sources and artifacts, which Foundry reads straight from disk. Its only
  # dependency, hardhat, never runs in this repo, and it brings a tree of vulnerable packages (undici, tmp, adm-zip…).
  '@ethereum-attestation-service/eas-contracts>hardhat': '-'
  # Patch or minor releases of the same line, with the advisories fixed.
  'ws@>=8.0.0 <8.21.0': 8.21.3
  '@hono/node-server@<1.19.15': 1.19.17
  'postcss@<8.5.23': 8.5.28
  'uuid@<11.1.1': 11.1.1
  'deepmerge-ts@<8.0.0': 8.0.2
