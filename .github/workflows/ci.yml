name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI builds and tests, it never writes to the repository.
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contracts (fmt / build / test / coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        run: forge test -vv

      - name: Coverage floor (90% lines on the core contracts)
        working-directory: contracts
        run: |
          forge coverage --report lcov --no-match-coverage "(script|test|mocks)"
          node ../scripts/check-coverage.mjs lcov.info 90 \
            src/access/RoleRegistry.sol \
            src/needs/NeedsRegistry.sol \
            src/funds/AidVault.sol \
            src/funds/AidVaultFactory.sol \
            src/funds/TrancheLedger.sol \
            src/resolvers/ProofOfAidResolver.sol \
            src/conversion/ConversionRouter.sol \
            src/funds/DonationForwarder.sol \
            src/funds/DonationForwarderFactory.sol \
            src/funds/DonationConversion.sol \
            src/funds/DonationReceipt.sol \
            src/delivery/DeliveryManager.sol \
            src/programs/ProgramRegistry.sol \
            src/beneficiaries/BeneficiaryRegistry.sol \
            src/community/CommunityProofs.sol

  typescript:
    name: TypeScript (lint / typecheck / build / test)
    runs-on: ubuntu-latest

    # The services talk to a real database; nothing here is mocked.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poa
          POSTGRES_PASSWORD: poa
          POSTGRES_DB: poa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://poa:poa@localhost:5432/poa
      ANVIL_RPC_URL: http://127.0.0.1:8545
      PONDER_NETWORK: anvil
      NEXT_PUBLIC_CHAIN_ID: '31337'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # A clean clone has no deployments/*.json, and the indexer and frontend are typed against real addresses.
      # Deploying to a throwaway anvil chain keeps the code strict and exercises the deploy scripts on every push.
      - name: Deploy to a local chain
        run: |
          anvil --chain-id 31337 --silent &
          for _ in $(seq 1 30); do
            cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break
            sleep 1
          done
          pnpm deploy:local

      # The indexer's `ponder:*` module types live in ponder-env.d.ts, which Ponder generates and git ignores.
      - name: Generate the indexer's types
        run: pnpm --filter @poa/indexer codegen

      - name: Prepare the database schema
        run: pnpm --filter @poa/shared db:push

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test
